<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosen Kinawi | PropTech Consultant</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --sub-text: #94a3b8; --accent: #38bdf8; --border: #334155; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        .container { background-color: var(--card-bg); border: 1px solid var(--border); padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); max-width: 600px; width: 100%; }
        h1 { color: var(--accent); font-size: 28px; margin-bottom: 5px; }
        h2 { font-size: 18px; color: var(--text); font-weight: normal; margin-top: 0; margin-bottom: 25px; }
        p { color: var(--sub-text); line-height: 1.7; font-size: 16px; margin: 10px 0; }
        .badge { background-color: #0369a1; border: 1px solid var(--accent); color: var(--text); padding: 8px 18px; border-radius: 50px; font-weight: bold; display: inline-block; margin-top: 25px; font-size: 14px; }
    </style>
</head>
<body>
    
    <div class="container">
        <h1>حسين كيناوي | Hosen Kinawi</h1>
        <h2>استشاري تكنولوجيا العقارات (PropTech Consultant)</h2>
        <p>متخصص في تصميم ودمج البنية التحتية التقنية، أنظمة المنازل الذكية، وحلول الطاقة المستدامة.</p>
        <p>مشاريع استشارية دولية بين بورصة 🇹🇷 ودمشق 🇸🇾.</p>
        <div class="badge">Verified Infrastructure Expert</div>
    </div>
</body>
</html>
